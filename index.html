<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Riconoscimento quadri</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* fallback minimo se CSS non carica */
        body {
            margin: 0;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        .video-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .video-container {
            position: relative;
        }

        video {
            width: 480px;
            border-radius: 12px;
        }

        #overlay {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.65);
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            width: 480px;
            margin-top: 10px;
        }

        button {
            padding: 10px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .hidden { display: none; }
    </style>
</head>

<body>

<main>
    <div id="status">✨ Sto preparando l’esperienza artistica…</div>

    <div class="video-wrapper">

        <div class="video-container hidden" id="videoBox">
            <video id="video" autoplay playsinline></video>
            <div id="overlay">In attesa del riconoscimento…</div>
        </div>

        <div class="controls">
            <button id="startBtn" disabled>Avvia</button>
            <button id="stopBtn" disabled>Stop</button>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>

<script type="module">
import { initRecognizer, recognizeFrame } from "./recognizer.js";

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const status = document.getElementById("status");
const videoBox = document.getElementById("videoBox");

let running = false;
let lastGood = null;
let missCount = 0;
const MISS_LIMIT = 5;

// ==========================
// CAMERA
// ==========================
async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
}

// ==========================
// INIT
// ==========================
async function loadEverything() {
    status.textContent = "🎨 Caricamento modello…";

    await initRecognizer();

    status.textContent = "📷 Avvio webcam…";

    await startCamera();

    status.textContent = "✨ Pronto!";

    startBtn.disabled = false;
    stopBtn.disabled = false;

    videoBox.classList.remove("hidden");
}

// ==========================
// LOOP 
// ==========================
async function loop() {
    if (!running) return;

    const result = await recognizeFrame(video);

    if (result?.skip) {
        requestAnimationFrame(loop);
        return;
    }

    // ==========================
    // CASO: riconosciuto
    // ==========================
    if (result && result.bestName) {
        lastGood = result;
        missCount = 0;

        overlay.textContent =
            `🎨 ${result.bestName.replace(/\.[^/.]+$/, "")} (${result.bestScore.toFixed(2)})`;

    }
    // ==========================
    // CASO: NON riconosciuto
    // ==========================
    else {
        missCount++;

        if (missCount >= MISS_LIMIT) {
            lastGood = null;
            overlay.textContent = "Nessun quadro riconosciuto";
        } else if (lastGood) {
            // breve “memoria visiva”, ma non infinita
            overlay.textContent =
                `🎨 ${lastGood.bestName.replace(/\.[^/.]+$/, "")} (${lastGood.bestScore.toFixed(2)})`;
        } else {
            overlay.textContent = "Nessun quadro riconosciuto";
        }
    }

    requestAnimationFrame(loop);
}

// ==========================
// START / STOP
// ==========================
function startRecognition() {
    running = true;
    status.textContent = "🔍 Riconoscimento attivo…";
    loop();
}

function stopRecognition() {
    running = false;
    status.textContent = "⛔ Riconoscimento fermato";
}

loadEverything();

startBtn.addEventListener("click", startRecognition);
stopBtn.addEventListener("click", stopRecognition);
</script>

</body>
</html>
