<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Aalma Lumiere</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <div id="status">✨ Loading…</div>

        <div class="video-wrapper">

            <div class="video-container hidden" id="videoBox">
                <video id="video" autoplay playsinline></video>
                <div id="overlay">Waiting to start...</div>
            </div>

            <div class="controls">
                <button id="startBtn" disabled>Start</button>
                <button id="stopBtn" disabled>Stop</button>
                <button id="switchCamBtn" disabled>Switch Camera</button>
            </div>

        </div>
    </main>

    <!-- EXPERIENCE -->
    <div id="experience" class="hidden">
        <div class="experience-inner">
            <img id="topImage">
            <img id="bottomImage">
            <canvas id="breakCanvas"></canvas>
        </div>
    </div>


    <!-- BLU SELECTOR -->
    <div id="bluSelector" class="hidden">
        <div id="bluContent">
            <h2 id="bluTitle">Choose a painting</h2>
            <div id="bluGrid"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>

    <script type="module">
        import { initRecognizer, recognizeFrame } from "./recognizer.js";
        import { breakImage } from "./physics.js";

        const video = document.getElementById("video");
        const overlay = document.getElementById("overlay");
        const startBtn = document.getElementById("startBtn");
        const stopBtn = document.getElementById("stopBtn");
        const switchCamBtn = document.getElementById("switchCamBtn");
        const status = document.getElementById("status");
        const videoBox = document.getElementById("videoBox");

        const exp = document.getElementById("experience");
        const topImg = document.getElementById("topImage");
        const bottomImg = document.getElementById("bottomImage");
        const canvas = document.getElementById("breakCanvas");

        let running = false;
        let stableName = null;
        let stableStart = 0;
        const STABLE_TIME = 1000;
        let inExperience = false;

        // CAMERA MANAGEMENT
        let currentDeviceId = null;
        let videoDevices = [];

        function loadImage(img, src) {
            return new Promise((resolve) => {
                img.onload = () => resolve(img);
                img.onerror = () => {
                    console.error("❌ Immagine mancante:", src);
                    img.src = "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
                    resolve(img);
                };
                img.src = src + "?v=" + Date.now();
            });
        }

        async function startCamera(deviceId = null) {
            const constraints = deviceId
                ? { video: { deviceId: { exact: deviceId } } }
                : { video: { facingMode: "environment" } };

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            await video.play();
        }

        async function loadCameras() {
            // Necessario su mobile per sbloccare enumerateDevices
            await navigator.mediaDevices.getUserMedia({ video: true });

            const devices = await navigator.mediaDevices.enumerateDevices();
            videoDevices = devices.filter(d => d.kind === "videoinput");

            if (videoDevices.length > 1) {
                switchCamBtn.disabled = false;
            }
        }

        async function switchCamera() {
            if (videoDevices.length < 2) return;

            const currentIndex = videoDevices.findIndex(d => d.deviceId === currentDeviceId);
            const nextIndex = (currentIndex + 1) % videoDevices.length;

            currentDeviceId = videoDevices[nextIndex].deviceId;

            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }

            await startCamera(currentDeviceId);
        }

        async function loadEverything() {
            status.textContent = "🎨 Loading model…";
            await initRecognizer();

            status.textContent = "📷 Starting webcam…";
            await startCamera(); // apre la camera posteriore su mobile

            status.textContent = "📷 Detecting cameras…";
            await loadCameras();

            currentDeviceId = videoDevices[0]?.deviceId || null;

            status.textContent = "✨ Ready! Click Start!";
            startBtn.disabled = false;
            stopBtn.disabled = false;
            switchCamBtn.disabled = videoDevices.length < 2;

            videoBox.classList.remove("hidden");
            exp.classList.add("hidden");
        }

        async function loop() {
            if (!running || inExperience) return;

            const result = await recognizeFrame(video);

            if (result?.skip) {
                requestAnimationFrame(loop);
                return;
            }

            if (result && result.bestName) {

                if (stableName === result.bestName) {

                    if (Date.now() - stableStart > STABLE_TIME) {

                        if (result.bestName.startsWith("blu_") ||
                            result.bestName === "blu_full.jpg") {
                            triggerBluSelection();
                            return;
                        }

                        triggerExperience(result.bestName);
                        return;
                    }

                } else {
                    stableName = result.bestName;
                    stableStart = Date.now();
                }

                overlay.textContent =
                    `🎨 ${result.bestName.replace(/\.[^/.]+$/, "")} (${result.bestScore.toFixed(2)})`;

            } else {
                stableName = null;
                stableStart = 0;
                overlay.textContent = "Still no detection...";
            }

            requestAnimationFrame(loop);
        }

        const bluSelector = document.getElementById("bluSelector");
        const bluGrid = document.getElementById("bluGrid");

        function triggerBluSelection() {
            running = false;
            inExperience = true;
            stableName = null; // reset stabile per evitare trigger accidentali al ritorno

            bluGrid.innerHTML = "";

            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {

                    const img = document.createElement("img");
                    const name = `blu_${i}${j}.jpg`;

                    img.src = `assets/blue_paintings/${name}`;

                    img.onclick = () => {
                        bluSelector.classList.add("hidden");

                        if (name === "blu_11.jpg") {
                            showBlu11WithoutPhysics();
                            return;
                        }

                        triggerExperience(name);
                    };

                    bluGrid.appendChild(img);
                }
            }

            bluSelector.classList.remove("hidden");
        }

        async function triggerExperience(name) {
            try {
                inExperience = true;
                running = false;

                exp.classList.remove("hidden");

                const cleanName = name.replace(/\.[^/.]+$/, ".jpg");

                let topPath = cleanName.startsWith("blu_")
                    ? `assets/blue_paintings/${cleanName}`
                    : `assets/paintings/${cleanName}`;

                await Promise.all([
                    loadImage(topImg, topPath),
                    loadImage(bottomImg, `assets/poetry/poetry_${cleanName}`)
                ]);

                bottomImg.classList.remove("show");
                topImg.style.display = "block";

                await wait(1200);

                startBreakAnimation();

                bottomImg.classList.add("show");

                await wait(7000);

                resetExperience();

            } catch (err) {
                console.error("❌ Crash experience:", err);
                resetExperience();
            }
        }

        function showBlu11WithoutPhysics() {
            inExperience = true;
            running = false;

            exp.classList.remove("hidden");

            Promise.all([
                loadImage(topImg, "assets/blue_paintings/blu_11.jpg"),
                loadImage(bottomImg, "assets/poetry/poetry_blu_11.jpg")
            ]).then(() => {

                topImg.style.display = "none";
                bottomImg.classList.add("show");

                wait(5000).then(() => resetExperience());
            });
        }

        function startBreakAnimation() {
            const rect = topImg.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;

            canvas.style.width = rect.width + "px";
            canvas.style.height = rect.height + "px";

            const ctx = canvas.getContext("2d");
            ctx.scale(dpr, dpr);

            breakImage(topImg, canvas);

            topImg.style.display = "none";
        }

        function resetExperience() {
            exp.classList.add("hidden");

            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            bottomImg.classList.remove("show");
            topImg.style.display = "block";

            stableName = null;
            stableStart = 0;

            inExperience = false;
            running = true;

            loop();
        }

        function wait(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        function startRecognition() {
            running = true;
            status.textContent = "🔍 Painting detection...";
            loop();
        }

        function stopRecognition() {
            running = false;
            status.textContent = "⛔ Stopped. Click Start to resume.";
        }

        loadEverything();

        startBtn.addEventListener("click", startRecognition);
        stopBtn.addEventListener("click", stopRecognition);
        switchCamBtn.addEventListener("click", switchCamera);
    </script>
</body>

</html>
